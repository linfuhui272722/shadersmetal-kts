# codemagic.yaml
# CI configuration for building MetallumShaders on CodeMagic.
# Built for macOS ARM64 (Apple Silicon).
# Minecraft 26.2 / Java 25 / Gradle 9.5.1 / Fabric Loom 1.17.13 (Kotlin DSL)

workflows:
  metallum-shaders-build:
    name: Metallum Shaders Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        JAVA_VERSION: "25"
        GRADLE_VERSION: "9.5.1"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - .gradle/
    scripts:
      - name: Install Java 25 (Adoptium)
        script: |
          #!/usr/bin/env bash
          set -e
          echo "=== Installing Java 25 (Adoptium) ==="
          brew tap homebrew/cask-versions 2>/dev/null || true
          brew install --cask temurin@25 2>/dev/null || true
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
          sudo ln -sf $JAVA_HOME/bin/java /usr/local/bin/java
          sudo ln -sf $JAVA_HOME/bin/javac /usr/local/bin/javac
          echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $CM_ENV
          java -version

      - name: Download dependencies
        script: |
          #!/usr/bin/env bash
          set -e
          mkdir -p libs
          
          # Metallum
          if [ ! -f libs/metallum-1.0.1.jar ]; then
            echo "Downloading Metallum jar..."
            curl -L -o libs/metallum-1.0.1.jar \
              "https://github.com/EternityQwQ/MetalUniversal/releases/download/MetalUniversal_1.0.1/metallum-1.0.1.jar" \
              || echo "WARNING: could not download Metallum jar"
            if [ ! -s libs/metallum-1.0.1.jar ]; then
              mkdir -p tmp-stub/META-INF
              printf "Manifest-Version: 1.0\n" > tmp-stub/META-INF/MANIFEST.MF
              (cd tmp-stub && jar cf ../libs/metallum-1.0.1.jar META-INF/MANIFEST.MF)
              rm -rf tmp-stub
            fi
          fi
          
          # Sodium
          if [ ! -f libs/sodium-fabric-0.9.1+mc26.2.jar ]; then
            echo "Downloading Sodium jar..."
            curl -L -o libs/sodium-fabric-0.9.1+mc26.2.jar \
              "https://cdn.modrinth.com/data/AANobbMI/versions/2Yom1N68/sodium-fabric-0.9.1%2Bmc26.2.jar" \
              || echo "WARNING: could not download Sodium jar"
            if [ ! -s libs/sodium-fabric-0.9.1+mc26.2.jar ]; then
              mkdir -p tmp-stub/META-INF
              printf "Manifest-Version: 1.0\n" > tmp-stub/META-INF/MANIFEST.MF
              (cd tmp-stub && jar cf ../libs/sodium-fabric-0.9.1+mc26.2.jar META-INF/MANIFEST.MF)
              rm -rf tmp-stub
            fi
          fi
          
          ls -la libs/

      - name: Download and Verify Minecraft Client JAR
        script: |
          #!/usr/bin/env bash
          set -e
          echo "=== Downloading and Verifying Minecraft Client JAR ==="
          mkdir -p libs
          
          MC_JAR="libs/minecraft-26.2-client.jar"
          MC_URL="https://libraries.minecraft.net/com/mojang/minecraft/26.2/minecraft-26.2-client.jar"
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          download_and_verify() {
            # 使用 wget 进行下载，支持断点续传
            echo "Attempting to download Minecraft Client JAR (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            # 删除可能存在的部分下载文件
            rm -f "$MC_JAR"
            
            # 使用 wget 下载，设置超时和重试
            if ! wget --timeout=30 --tries=2 -O "$MC_JAR" "$MC_URL"; then
              echo "ERROR: Failed to download Minecraft Client JAR using wget"
              return 1
            fi
            
            # 验证文件是否为有效的 ZIP 文件
            if ! unzip -t "$MC_JAR" > /dev/null 2>&1; then
              echo "ERROR: Downloaded file is not a valid ZIP archive"
              rm -f "$MC_JAR"
              return 1
            fi
            
            # 验证文件大小是否合理（大于 10MB）
            FILE_SIZE=$(stat -f%z "$MC_JAR" 2>/dev/null || stat -c%s "$MC_JAR" 2>/dev/null || echo "0")
            if [ "$FILE_SIZE" -lt 10485760 ]; then
              echo "ERROR: Downloaded file is too small ($FILE_SIZE bytes), likely incomplete"
              rm -f "$MC_JAR"
              return 1
            fi
            
            # 列出部分内容以进一步验证
            echo "Downloaded file size: $FILE_SIZE bytes"
            echo "Sample contents:"
            jar tf "$MC_JAR" | head -5 || true
            
            echo "SUCCESS: Minecraft Client JAR downloaded and verified"
            return 0
          }
          
          # 重试下载逻辑
          until download_and_verify; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: Failed to download and verify Minecraft Client JAR after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Waiting before retry..."
            sleep 5
          done
          
          # 最终验证
          if [ ! -f "$MC_JAR" ]; then
            echo "ERROR: Minecraft Client JAR does not exist after download attempts"
            exit 1
          fi
          
          echo "=== Minecraft Client JAR ready ==="

      - name: Setup Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          set -e
          export JAVA_HOME=${JAVA_HOME:-/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home}
          export PATH=$JAVA_HOME/bin:$PATH
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v9.5.1/gradle/wrapper/gradle-wrapper.jar" \
              || {
                if command -v gradle &>/dev/null; then
                  gradle wrapper --gradle-version 9.5.1 --distribution-type bin
                else
                  echo "ERROR: gradle-wrapper.jar download failed and gradle not found"
                  exit 1
                fi
              }
          fi
          chmod +x ./gradlew

      - name: Build native Metal JNI shim (ARM64)
        script: |
          #!/usr/bin/env bash
          set -e
          export JAVA_HOME=${JAVA_HOME:-/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home}
          echo "Building native Metal JNI shim for ARM64"
          mkdir -p build/native/macos-arm64
          SRC=src/main/cpp/metallum_shaders.cpp
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang++ -x objective-c++ -std=c++17 -stdlib=libc++ -fobjc-arc \
            -arch arm64 -dynamiclib \
            -I"$SDK/System/Library/Frameworks/Metal.framework/Headers" \
            -I"$SDK/System/Library/Frameworks/Foundation.framework/Headers" \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/darwin" \
            -F"$SDK/System/Library/Frameworks" \
            -framework Metal -framework Foundation \
            -o build/native/macos-arm64/libmetallum_shaders.dylib "$SRC"
          # Copy into resources so the jar bundles them
          mkdir -p src/main/resources/native/macos-arm64
          cp build/native/macos-arm64/libmetallum_shaders.dylib \
            src/main/resources/native/macos-arm64/
          echo "Native arm64 dylib built and bundled."

      - name: Build mod jar
        script: |
          #!/usr/bin/env bash
          set -e
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
          export PATH=$JAVA_HOME/bin:$PATH
          echo "=== Environment Check ==="
          java -version
          echo "Stopping all Gradle daemons..."
          ./gradlew --stop || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar still missing"
            exit 1
          fi
          
          # 再次验证 MC JAR 是否存在
          if [ ! -f "libs/minecraft-26.2-client.jar" ]; then
            echo "ERROR: Minecraft Client JAR not found before build"
            exit 1
          fi
          
          echo "Building mod jar with Java 25 and Gradle 9.5.1..."
          ./gradlew clean build --no-daemon --stacktrace \
            -Dorg.gradle.java.home=$JAVA_HOME \
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Verify jar contents
        script: |
          #!/usr/bin/env bash
          set -e
          JAR=$(ls build/libs/metallum-shaders-*.jar | head -n1)
          echo "Built jar: $JAR"
          jar tf "$JAR" | head -50
          echo "----"
          echo "Shader files:"
          jar tf "$JAR" | grep -E '\.(metal|metalh)$' || true
          echo "----"
          echo "Native libs:"
          jar tf "$JAR" | grep -E '\.dylib$' || echo "(no dylibs found)"

    artifacts:
      - build/libs/*.jar
      - build/native/**/*.dylib
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
